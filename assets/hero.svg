<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">David Le — Software Engineering</title>
  <desc id="description">A clean professional header for David Le's software engineering portfolio.</desc>
  <defs>
