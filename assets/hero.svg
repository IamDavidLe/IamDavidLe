  <text x="136" y="218" fill="#FFFFFF" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="78" font-weight="700" letter-spacing="-2">DAVID LE</text>
  <text x="140" y="267" fill="#BFD7F5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="27">Python · algorithms · thoughtful engineering</text>
